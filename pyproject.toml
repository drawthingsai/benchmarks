[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducible-gguf-benchmarks"
version = "0.1.0"
description = "Reproducible GGUF benchmarking and community model comparisons"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["evalscope==1.11.0"]

[project.scripts]
gguf-bench = "benchmark:main"

[tool.setuptools]
py-modules = ["benchmark", "report"]
